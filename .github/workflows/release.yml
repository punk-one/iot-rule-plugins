name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
env:
  GOWORK: off
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes
  plugins:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: sigstore/cosign-installer@v3
      - name: Test independent modules on the target CPU
        run: go test . && go vet . && ./scripts/test-plugins.sh
      - name: Build only the selected plugins
        env:
          CGO_ENABLED: '0'
          PLUGIN_REQUIRE_SIGNATURE: '1'
          PLUGIN_SIGNING_MODE: keyless
        run: |
          export PLUGINS_OVERRIDE="$(cat release-plugins.txt)"
          ./build-plugins.sh
          python3 scripts/package-plugins.py --sign
      - name: Verify publisher identity for every artifact
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          find dist/plugins -type f -name '*.so' -print0 | while IFS= read -r -d '' artifact; do
            cosign verify-blob "$artifact" --bundle "$artifact.sigstore.json" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
      - name: Upload one archive per plugin, version and platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/releases/*
  publish:
    needs: plugins
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
